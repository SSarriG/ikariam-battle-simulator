<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikariam Battle Simulator</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/config.css">
    <link rel="stylesheet" href="styles/battlefieldMatrix.css">
</head>

<body>
    <!-- Backgrounds -->
    <div id="sky-bg"></div>
    <div id="top-separator"></div>

    <!-- Main Container -->
    <div id="main-container">

        <!-- Main Header -->
        <div id="main-header">
            <div class="header-content">
                <div class="header-title">Simulador de batallas de ikariam</div>
                <div class="battle-type-group">
                    <div class="battle-type-btn active" id="btn-terrestrial" onclick="app.setBattleType('terrestrial')">
                        <div class="btn-inner">Batalla terrestre</div>
                    </div>
                    <div class="battle-type-btn" id="btn-maritime" onclick="app.setBattleType('maritime')">
                        <div class="btn-inner">Batalla naval</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Config (Town Hall / Wall) -->
        <div id="global-config">
            <div class="config-item">
                <label>Nivel intendencia</label>
                <div class="input-wrapper">
                    <input type="number" id="townHallLevel" value="25" min="1" max="66">
                </div>
            </div>
            <div class="config-item">
                <label>Nivel muralla</label>
                <div class="input-wrapper">
                    <input type="number" id="wallLevel" value="0" min="0" max="48">
                </div>
            </div>
            <!-- Maritime specific inputs (hidden by default) -->
            <div class="config-item hidden" id="port-config">
                <label>Nivel puerto</label>
                <div class="input-wrapper">
                    <input type="number" id="portLevel" value="20" min="1" max="66">
                </div>
            </div>
        </div>

        <!-- Attacker Section -->
        <div class="unit-section" id="attacker-section">
            <!-- Config Grid Container -->
            <div class="unit-config-container">
                <div class="section-header">
                    <div class="header-left">
                        <button class="btn-secondary" onclick="app.clearUnits('attacker')">
                            <div class="btn-inner">Borrar todo</div>
                        </button>
                    </div>
                    <div class="header-center">Tropas atacante</div>
                    <div class="header-right">
                        <button class="btn-secondary" onclick="app.applyUpgrades('attacker')">
                            <div class="btn-inner">Aplicar todas mejoras</div>
                        </button>
                    </div>
                </div>

                <!-- Hephaestus Level Selector -->
                <div class="hephaestus-selector">
                    <label for="attacker-hephaestus">Nivel Hefesto:</label>
                    <select id="attacker-hephaestus" class="hephaestus-select">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>

                    <label for="attacker-unit-type" style="margin-left: 20px;">Tipo unidades:</label>
                    <select id="attacker-unit-type" class="hephaestus-select"
                        onchange="app.filterUnitType('attacker', this.value)">
                        <option value="normal">Normales</option>
                        <option value="barbarian">Bárbaras</option>
                    </select>
                </div>

                <!-- Unit Grid (Populated by JS or Static) -->
                <div class="unit-grid" id="attacker-grid">
                    <!-- Units will be generated here -->
                </div>
            </div>

            <!-- Visualization Container -->
            <div class="visualization-container">
                <!-- Reserves -->
                <div class="reserves-container">
                    <div class="reserves-header">Reservas</div>
                    <div class="reserves-list" id="attacker-reserves">
                        <!-- Reserve slots -->
                    </div>
                </div>

                <!-- Battlefield Matrix -->
                <div class="matrix-container">
                    <div class="battlefield-matrix" id="attacker-matrix">
                        <!-- Matrix slots -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Defender Section -->
        <div class="unit-section" id="defender-section">
            <!-- Config Grid Container -->
            <div class="unit-config-container">
                <div class="section-header">
                    <div class="header-left">
                        <button class="btn-secondary" onclick="app.clearUnits('defender')">
                            <div class="btn-inner">Borrar todo</div>
                        </button>
                    </div>
                    <div class="header-center">Tropas defensor</div>
                    <div class="header-right">
                        <button class="btn-secondary" onclick="app.applyUpgrades('defender')">
                            <div class="btn-inner">Aplicar todas mejoras</div>
                        </button>
                    </div>
                </div>

                <!-- Hephaestus Level Selector -->
                <div class="hephaestus-selector">
                    <label for="defender-hephaestus">Nivel Hefesto:</label>
                    <select id="defender-hephaestus" class="hephaestus-select">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>

                    <label for="defender-unit-type" style="margin-left: 20px;">Tipo unidades:</label>
                    <select id="defender-unit-type" class="hephaestus-select"
                        onchange="app.filterUnitType('defender', this.value)">
                        <option value="normal">Normales</option>
                        <option value="barbarian">Bárbaras</option>
                    </select>
                </div>

                <div class="unit-grid" id="defender-grid">
                    <!-- Units will be generated here -->
                </div>
            </div>

            <!-- Visualization Container -->
            <div class="visualization-container">
                <!-- Reserves -->
                <div class="reserves-container">
                    <div class="reserves-header">Reservas</div>
                    <div class="reserves-list" id="defender-reserves">
                        <!-- Reserve slots -->
                    </div>
                </div>

                <!-- Battlefield Matrix -->
                <div class="matrix-container">
                    <div class="battlefield-matrix" id="defender-matrix">
                        <!-- Matrix slots -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <button class="btn-action" onclick="app.saveConfig()">Guardar configuración</button>
            <button class="btn-action" onclick="app.loadConfig()">Cargar configuración</button>
            <button class="btn-primary-ikariam" onclick="app.runSimulation()">
                <div class="btn-inner">Empezar batalla</div>
            </button>
        </div>

    </div>

    <!-- Step Mode Controls (Hidden initially) -->
    <div class="step-controls" style="display: none;">
        <div class="round-status">
            <span>Round: <strong id="current-round">0</strong> / 60</span>
            <span class="status-badge" id="battle-status">Not Started</span>
        </div>
        <div class="button-group">
            <button class="btn-game btn-primary next-round-button" disabled>▶️ Next Round</button>
            <button class="btn-game reset-button" disabled>🔄 Reset</button>
        </div>
        <div id="step-battlefield" class="battlefield-container"></div>
        <div id="step-log" class="battle-log"></div>
    </div>

    <script src="scripts/battlefieldMatrix.js"></script>
    <script src="dist/bundle_v36.js"></script>
</body>

</html>
